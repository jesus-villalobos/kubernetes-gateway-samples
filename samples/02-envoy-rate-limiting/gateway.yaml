# Envoy Gateway: a Gateway of class "eg" plus the same shape of HTTPRoute used
# in the Istio sample. Applying the portable route here shows routes transfer
# between implementations unchanged.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: eg-gateway
  namespace: envoy-demo
spec:
  gatewayClassName: eg
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: api.example.com
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: echo-route
  namespace: envoy-demo
spec:
  parentRefs:
    - name: eg-gateway
  hostnames:
    - api.example.com
  rules:
    - matches:
        - path: { type: PathPrefix, value: /echo }
      backendRefs:
        - name: echo
          port: 80
