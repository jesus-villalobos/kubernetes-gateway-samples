# Header manipulation on Envoy Gateway. The add/set/remove request and response
# header actions are core Gateway API filters, so they are portable; the echo
# app reflects request headers so the effect is visible. Client-IP handling
# (next file) is the Envoy-specific advanced piece.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: eg-hdr-gateway
  namespace: envoy-demo
spec:
  gatewayClassName: eg
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: api.example.com
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: echo-hdr-route
  namespace: envoy-demo
spec:
  parentRefs:
    - name: eg-hdr-gateway
  hostnames:
    - api.example.com
  rules:
    - matches:
        - path: { type: PathPrefix, value: /echo }
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            add:
              - name: x-demo-added
                value: "added-by-gateway"
            set:
              - name: x-demo-tier
                value: "standard"
            remove:
              - x-internal-only
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            add:
              - name: x-demo-response
                value: "seen-on-the-way-out"
      backendRefs:
        - name: echo
          port: 80
