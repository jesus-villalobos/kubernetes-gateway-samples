# Higress gateway surface via the Gateway API (class "higress"), plus the same
# echo HTTPRoute. Authentication is layered on with a Wasm plugin (next file).
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: higress-gateway
  namespace: higress-demo
spec:
  gatewayClassName: higress
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: api.example.com
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: echo-route
  namespace: higress-demo
spec:
  parentRefs:
    - name: higress-gateway
  hostnames:
    - api.example.com
  rules:
    - matches:
        - path: { type: PathPrefix, value: /echo }
      backendRefs:
        - name: echo
          port: 80
